# Prometheus Configuration for Bullseye Framework

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'bullseye-monitor'

# Alerting configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files: []

# Scrape configurations
scrape_configs:
  # Bullseye API metrics
  - job_name: 'bullseye'
    static_configs:
      - targets: ['bullseye:8080']
    metrics_path: '/api/v1/metrics'
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL exporter (optional)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']
