[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bullseye"
version = "0.1.0"
description = "A quantitative trading framework compatible with Freqtrade, supporting crypto, stock, and futures trading"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Bullseye Contributors"}
]
keywords = ["trading", "quantitative", "crypto", "stock", "futures", "freqtrade"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    # Core dependencies
    "pandas>=2.0.0",
    "numpy>=1.24.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",

    # Trading / Data
    "ccxt>=4.0.0",

    # Technical analysis
    "ta-lib>=0.4.0",
    "pandas-ta>=0.3.14b",
    "TA-Lib>=0.4.28",

    # Optimization
    "optuna>=3.5.0",
    "scikit-optimize>=0.10.0",

    # Configuration
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "toml>=0.10.2",

    # Logging
    "structlog>=24.0.0",
    "colorlog>=6.8.0",

    # RPC / API
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",

    # CLI
    "click>=8.1.0",
    "rich>=13.7.0",

    # Utils
    "python-dateutil>=2.8.0",
    "pytz>=2024.1",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
# Stock market data
stock = [
    "tushare>=1.4.0",
    "akshare>=1.12.0",
]

# Future trading
future = [
    "vnpy>=3.9.0",
]

# All extras
all = [
    "bullseye[stock,future]",
]

# Development
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
]

# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-mermaid2-plugin>=1.1.1",
]

# Plotting
plot = [
    "plotly>=5.19.0",
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.8.0",
]

[project.scripts]
bullseye = "bullseye.__main__:cli"

[project.urls]
Homepage = "https://github.com/your-org/bullseye"
Documentation = "https://bullseye.readthedocs.io"
Repository = "https://github.com/your-org/bullseye"
Issues = "https://github.com/your-org/bullseye/issues"

[tool.setuptools]
packages = ["bullseye"]

[tool.setuptools.package-data]
"bullseye" = ["*.yaml", "*.json", "templates/*"]

# ==================== Ruff configuration ====================
[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict
    "ARG001", # unused function argument (for interface methods)
    "ARG002",
    "SIM108", # use ternary operator (not always more readable)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/*" = ["ARG"]       # unused arguments in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ==================== MyPy configuration ====================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ==================== Pytest configuration ====================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

# ==================== Coverage configuration ====================
[tool.coverage.run]
source = ["bullseye"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
