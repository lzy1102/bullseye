# Bullseye Quantitative Trading Framework - Docker Compose
# Version 3.8 for Docker Compose compatibility

version: "3.8"

services:
  # Main Bullseye trading service
  bullseye:
    build:
      context: .
      dockerfile: Dockerfile
    image: bullseye:latest
    container_name: bullseye_trading
    restart: unless-stopped

    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - BULLSEYE_CONFIG=/app/config.yaml
      - BULLSEYE_USER_DATA=/app/user_data
      - TZ=Asia/Shanghai

    # Mount volumes for persistence and configuration
    volumes:
      # Configuration file
      - ./config.yaml:/app/config.yaml:ro

      # User data directory (strategies, data, logs, etc.)
      - ./user_data:/app/user_data

    # Port mappings (使用 9876 端口替代 8080)
    ports:
      - "9876:9876"  # API server
      - "8765:8765"  # WebSocket

    # Command override for different modes
    # Default: dry-run trading
    command: ["trade", "--dry"]

    # Network
    networks:
      - bullseye_network

networks:
  bullseye_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
