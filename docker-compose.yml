# Bullseye Quantitative Trading Framework - Docker Compose
# Compatible with Freqtrade command style
#
# Usage examples:
#   docker-compose run --rm bullseye download-data --exchange okx --pairs BTC/USDT --timeframes 30m
#   docker-compose run --rm bullseye backtesting --strategy MyStrategy
#   docker-compose run --rm bullseye hyperopt --strategy MyStrategy --hyperopt-loss SharpeHyperOptLoss --epochs 1000

version: "3.8"

services:
  # Main bullseye CLI service (one-shot commands)
  # All commands are passed through to bullseye CLI
  bullseye:
    build:
      context: .
      dockerfile: Dockerfile
    image: bullseye:latest
    container_name: bullseye_cli
    restart: "no"

    environment:
      - PYTHONUNBUFFERED=1
      - BULLSEYE_CONFIG=/app/user_data/config.yaml
      - BULLSEYE_USER_DATA=/app/user_data
      - TZ=Asia/Shanghai

    volumes:
      - ./user_data:/app/user_data

    # Default command - overridden by docker-compose run arguments
    # docker-compose run --rm bullseye <command> [args...]
    command: []

    networks:
      - bullseye_network

  # Trading service (long-running)
  trading:
    build:
      context: .
      dockerfile: Dockerfile
    image: bullseye:latest
    container_name: bullseye_trading
    restart: unless-stopped

    environment:
      - PYTHONUNBUFFERED=1
      - BULLSEYE_CONFIG=/app/user_data/config.yaml
      - BULLSEYE_USER_DATA=/app/user_data
      - TZ=Asia/Shanghai

    volumes:
      - ./user_data:/app/user_data

    ports:
      - "9876:9876"  # API server
      - "8765:8765"  # WebSocket

    command: ["trade", "--dry"]

    networks:
      - bullseye_network

networks:
  bullseye_network:
    driver: bridge
